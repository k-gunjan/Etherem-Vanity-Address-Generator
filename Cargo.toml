[package]
name = "ethereum-vanity-address"
version = "0.1.0"
edition = "2021"
authors = ["K Gunjan <https://github.com/k-gunjan>"]
description = "etherem address genertor with custom pattern in it"


[dependencies]
crossterm = "0.26.1"
dhat = { version="0.3.3", optional=true } 
ethers = { version = "2", default-features = false, features = ["ws", "rustls"] }
hex = "0.4.3"
regex = "1.8.4"
secp256k1 = { version = "0.27.0", features = ["rand"] }
tiny-keccak = { version = "1.4" }
web3 = "0.18.0"

[features]
dhat-heap = ["dep:dhat"]

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

[[bench]]
name = "wallet_generator"
harness = false